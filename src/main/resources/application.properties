# Choix de l'agent : "faux" (aucun modèle requis) ou "ollama" (vraie implémentation)
description.agent=ollama

description.ollama.url=http://localhost:11434
description.ollama.modele=gemma3:latest
description.ollama.delai-ms=120000

# Limites d'upload (Spring refuse 1 Mo par défaut ; une photo de téléphone la dépasse)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
