<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dépôt d'image</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="page-depot">
            <section class="carte-depot">
                <header class="carte-depot__entete">
                    <h1 class="carte-depot__titre">Déposer une image</h1>
                    <p class="carte-depot__sous-titre">Choisissez une image avec le bouton de sélection, ou déposez-la dans la zone prévue. Formats acceptés : PNG, JPG ou WEBP.</p>
                </header>

                <form id="formulaire-depot" novalidate>
                    <label id="zone-depot" class="zone-depot" for="champ-fichier-image">
                        <span class="zone-depot__contenu zone-depot__contenu--defaut">
                            <span class="zone-depot__pictogramme" aria-hidden="true"></span>
                            <span class="zone-depot__libelle">Choisir ou déposer une image</span>
                            <span class="zone-depot__aide">Vous pouvez aussi parcourir vos fichiers.</span>
                        </span>

                        <div id="apercu-image" class="apercu-image" hidden></div>

                        <input id="champ-fichier-image" class="zone-depot__champ-fichier" type="file" accept="image/png, image/jpeg, image/webp" aria-label="Choisir une image" aria-describedby="aide-depot" />
                    </label>
                    <p id="aide-depot" class="zone-depot__instructions">Formats acceptés : PNG, JPG ou WEBP. Utilisez le bouton de sélection pour choisir un fichier ou déposez une image dans cette zone.</p>
                    <p id="etat-depot" class="message-etat" role="status" aria-live="polite" aria-atomic="true"></p>

                    <div class="zone-precision">
                        <label class="zone-precision__label" for="champ-precision">Précisions sur l’image ou ce que vous voulez :</label>
                        <textarea id="champ-precision" class="zone-precision__champ-texte" name="description" rows="5" placeholder="Décrivez ce que vous voulez mettre en avant sur l’image, les détails à conserver, ou la demande précise..."></textarea>
                    </div>

                    <div class="carte-depot__pied">
                        <button id="bouton-valider" class="bouton-valider" type="submit">Valider</button>
                    </div>
                </form>
            </section>
        </main>

        <script>
            const inputFichier = document.getElementById("champ-fichier-image");
            const zoneDepot = document.getElementById("zone-depot");
            const apercuImage = document.getElementById("apercu-image");
            const formulaireDepot = document.getElementById("formulaire-depot");
            const etatDepot = document.getElementById("etat-depot");
            const typesAcceptes = ["image/png", "image/jpeg", "image/webp"];
            const extensionsAcceptees = [".png", ".jpg", ".jpeg", ".webp"];
            let urlApercu = null;

            function effacerApercu() {
                if (urlApercu) {
                    URL.revokeObjectURL(urlApercu);
                    urlApercu = null;
                }

                apercuImage.replaceChildren();
                apercuImage.hidden = true;
                zoneDepot.classList.remove("zone-depot--selectionnee");
            }

            function afficherFichier(fichier) {
                if (!fichier) {
                    return;
                }

                const extension = fichier.name.slice(fichier.name.lastIndexOf(".")).toLowerCase();
                const formatAccepte = typesAcceptes.includes(fichier.type)
                    || (!fichier.type && extensionsAcceptees.includes(extension));

                if (!formatAccepte) {
                    inputFichier.value = "";
                    effacerApercu();
                    etatDepot.textContent = "Format non accepté. Choisissez une image PNG, JPG ou WEBP.";
                    inputFichier.focus();
                    return;
                }

                effacerApercu();
                urlApercu = URL.createObjectURL(fichier);
                const image = document.createElement("img");
                image.src = urlApercu;
                image.alt = `Aperçu de l’image sélectionnée : ${fichier.name}`;
                apercuImage.append(image);
                apercuImage.hidden = false;
                zoneDepot.classList.add("zone-depot--selectionnee");
                etatDepot.textContent = `Image sélectionnée : ${fichier.name}.`;
            }

            inputFichier.addEventListener("change", () => {
                afficherFichier(inputFichier.files[0]);
            });

            ["dragenter", "dragover"].forEach((typeEvenement) => {
                zoneDepot.addEventListener(typeEvenement, (event) => {
                    event.preventDefault();
                    event.dataTransfer.dropEffect = "copy";
                    zoneDepot.classList.add("zone-depot--survol");
                });
            });

            ["dragleave", "drop"].forEach((typeEvenement) => {
                zoneDepot.addEventListener(typeEvenement, (event) => {
                    event.preventDefault();
                    zoneDepot.classList.remove("zone-depot--survol");
                });
            });

            zoneDepot.addEventListener("drop", (event) => {
                const fichier = event.dataTransfer.files[0];

                if (!fichier) {
                    return;
                }

                const transfert = new DataTransfer();
                transfert.items.add(fichier);
                inputFichier.files = transfert.files;
                afficherFichier(fichier);
            });

            formulaireDepot.addEventListener("submit", (event) => {
                event.preventDefault();

                if (!inputFichier.files.length) {
                    etatDepot.textContent = "Choisissez une image avant de valider.";
                    inputFichier.focus();
                    return;
                }
            });

        </script>
    </body>
</html>
